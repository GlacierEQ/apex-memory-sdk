[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-memory-sdk"
version = "1.0.0"
description = "Sovereign Omniversal Semantic Memory, Vector Store, Hebbian Synapse & Knowledge Graph Mesh"
readme = "README.md"
authors = [
    { name = "GlacierEQ Engineering", email = "glaciereq@users.noreply.github.com" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "cryptography>=3.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
apex-memory = "apex_memory.cli.main:main"

[project.urls]
Homepage = "https://github.com/GlacierEQ/apex-memory-sdk"
Repository = "https://github.com/GlacierEQ/apex-memory-sdk"
Issues = "https://github.com/GlacierEQ/apex-memory-sdk/issues"
Documentation = "https://github.com/GlacierEQ/apex-memory-sdk#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
